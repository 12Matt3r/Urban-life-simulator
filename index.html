  /* HUD */

<!-- ====== CORE BUS / APP ====== -->
<script>
  // Tiny event bus
  window.eventBus = (function(){
    const subs = {};
    return {
      publish: (topic, payload) => (subs[topic]||[]).forEach(fn=>fn(payload)),
      subscribe:(topic, fn)=>((subs[topic]=subs[topic]||[]).push(fn))
    };
  })();

  // App state
  window.__app = {
    history: [],
    stats: { health:100, sanity:100, money:0, fame:0, heat:0 },
    player: { name:'', role:'', adult:false },
    realm: 'uls',
    router: {
      routes: {},
      register(id, api){ __app.router.routes[id]=api; },
      go(id, params){ __app.realm=id; eventBus.publish('realm.changed',{realm:id, params}); __app.router.routes[id]?.enter?.(params||{}); }
    },
    gameManager: {
      getLastEvent(){ return __app.history[__app.history.length-1]||null; },
      commitTurn(ev){ __app.history.push(ev); eventBus.publish('turn.commit', ev); }
    }
  };
</script>

<!-- ====== HUD / TOASTS ====== -->
<script>
(function(){
  function setBar(cls, v){ v=Math.max(0,Math.min(100,v)); document.querySelector('.bar.'+cls+' > i').style.width=v+'%';}
  function setHUD(stats){
    setBar('health', stats.health);
    setBar('sanity', stats.sanity);
    setBar('money',  Math.min(100, Math.floor(stats.money/10)));
    setBar('fame',   Math.min(100, stats.fame));
    setBar('heat',   Math.min(100, stats.heat*20)); // 0..5 → 0..100
  }
  eventBus.subscribe('stats.update', p=>{ Object.assign(__app.stats, p||{}); setHUD(__app.stats); });
  eventBus.subscribe('hud.toast', p=>{
    const d=document.createElement('div'); d.className='toast'; d.textContent=p.text||'';
    document.getElementById('toasts').appendChild(d); setTimeout(()=>d.remove(), 3000);
  });
  setHUD(__app.stats);
})();
</script>

<!-- ====== RADIO ====== -->
<script>
(function(){
  const A=document.getElementById('radio-audio');
  const dingEl=document.getElementById('sfx-ding');
  const buzzEl=document.getElementById('sfx-buzz');
  // load SFX if provided
  if(ULS_CONFIG.SFX_DING) dingEl.src=ULS_CONFIG.SFX_DING;
  if(ULS_CONFIG.SFX_BUZZ) buzzEl.src=ULS_CONFIG.SFX_BUZZ;
  window.playDing = ()=>{ if(dingEl.src) dingEl.play(); };
  window.playBuzz = ()=>{ if(buzzEl.src) buzzEl.play(); };

  const stations = ULS_CONFIG.RADIO_STATIONS||[];
  let curS=0, curT=0, shuffle=false;
  const sel=document.getElementById('station');
  stations.forEach((s,i)=>{ const o=document.createElement('option'); o.value=i; o.textContent=s.name; sel.appendChild(o); });
  function setStation(i){ curS=i; curT=0; play(); eventBus.publish('radio.changed',{station:stations[curS]?.name}); }
  function setShuffle(v){ shuffle=!!v; }
  function next(){ if(!stations[curS]) return; if(shuffle) curT=Math.floor(Math.random()*stations[curS].tracks.length); else curT=(curT+1)%stations[curS].tracks.length; play(); }
  function prev(){ if(!stations[curS]) return; curT=(curT-1+stations[curS].tracks.length)%stations[curS].tracks.length; play(); }
  function play(){ const s=stations[curS]; if(!s||!s.tracks.length) return; const url=s.tracks[curT]; A.src=url; A.play(); }
  function toggle(){ if(A.paused) A.play(); else A.pause(); }
  sel.onchange=()=>setStation(+sel.value);
  document.getElementById('rShuffle').onchange=(e)=>setShuffle(e.target.checked);
  document.getElementById('rPrev').onclick=prev;
  document.getElementById('rNext').onclick=next;
  document.getElementById('rToggle').onclick=toggle;
  if(stations.length) setStation(0);
  window.Radio={ next, prev, toggle, setShuffle };
})();
</script>

<!-- ====== IMAGE RENDER BRIDGE (WebSim) ====== -->
<script>
(function(){
  let iframe=null;
  function ensure(){
    if(iframe) return;
    iframe=document.createElement('iframe'); iframe.src=ULS_CONFIG.IMAGE_RENDER_URL; iframe.style.display='none'; document.body.appendChild(iframe);
    window.addEventListener('message', onMsg);
  }
  function onMsg(e){
    if(!e.data||!e.data.image) return;
    const img = document.getElementById('stage-img');
    if(e.data.image?.dataUrl){ img.src = e.data.image.dataUrl; }
    if(e.data.image?.url){ img.src = e.data.image.url; }
  }
  eventBus.subscribe('image.request', p=>{
    ensure();
    const payload = { prompt:p.prompt, style:p.style||'cinematic neon city' };
    iframe.contentWindow.postMessage({ from:'uls', type:'image.request', payload }, '*');
  });
})();
</script>

<!-- ====== NARRATOR BRIDGE (PG-13/ADULT) & AUTOPILOT ====== -->
<script>
(function(){
  let iframe=null, ready=false, waitQ=[];
  function ensure(url){
    if(iframe){ if(iframe.src!==url) iframe.src=url; return; }
    iframe=document.createElement('iframe'); iframe.style.display='none'; iframe.src=url; document.body.appendChild(iframe);
    window.addEventListener('message', onMsg);
  }
  function onMsg(e){
    const d=e.data;
    if(!d||!d.narrator) return;
    if(d.type==='ready'){ ready=true; waitQ.forEach(f=>f()); waitQ.length=0; }
    if(d.type==='response'){ eventBus.publish('narrator.response', d.payload); }
    if(d.type==='autopilot.suggestion'){ eventBus.publish('narrator.autopilot.suggestion', d.payload); }
    if(d.type==='coin.result'){ eventBus.publish('coin.result', d.payload); }
  }
  function send(payload){
    if(!iframe) return;
    iframe.contentWindow.postMessage({ from:'uls', payload }, '*');
  }
  eventBus.subscribe('narrator.ask', payload=>{
    const url = __app.player.adult ? ULS_CONFIG.NARRATOR_ADULT_URL : ULS_CONFIG.NARRATOR_PG13_URL;
    ensure(url);
    const go=()=>send({type:'ask', data:payload});
    if(!ready) waitQ.push(go); else go();
  });
  // autopilot suggestions
  eventBus.subscribe('narrator.autopilot.suggestAction', payload=>{
    const url = ULS_CONFIG.NARRATOR_AUTOPILOT_URL || ( __app.player.adult ? ULS_CONFIG.NARRATOR_ADULT_URL : ULS_CONFIG.NARRATOR_PG13_URL );
    ensure(url);
    const go=()=>send({type:'autopilot.suggest', data:payload});
    if(!ready) waitQ.push(go); else go();
  });
  // proxy coin flips to narrator if desired
  eventBus.subscribe('coin.flip', payload=>{
    const url = __app.player.adult ? ULS_CONFIG.NARRATOR_ADULT_URL : ULS_CONFIG.NARRATOR_PG13_URL;
    ensure(url);
    const go=()=>send({type:'coin.flip', data:payload});
    if(!ready) waitQ.push(go); else go();
  });
})();
</script>

<!-- ====== COIN ENGINE + DOUBLE OR NOTHING + SFX ====== -->
<script>
(function(){
  const DNU = { count:0, locked:false, season:1 };
  function flipOnce(diff){ const p = diff==='easy'?0.65 : diff==='hard'?0.35 : 0.5; return Math.random()<p; }
  function resolve(payload){
    const diff = payload?.difficulty || 'even';
    const success = flipOnce(diff);
    const dmg = success? 0 : (payload?.failDamage || 10);
    const reward = success? (payload?.reward||10) : 0;
    if(success) playDing(); else playBuzz();
    if(reward) eventBus.publish('stats.update',{ money: __app.stats.money + reward });
    if(dmg) eventBus.publish('stats.update',{ health: Math.max(0,__app.stats.health - dmg) });
    eventBus.publish('coin.result',{ success, diff, dmg, reward });
  }
  eventBus.subscribe('coin.flip', resolve);

  // DoN policy: after you invoke DoN once, you may chain one more (then lock until season advance)
  eventBus.subscribe('coin.doubleOrNothing', ()=>{
    if(DNU.locked){ eventBus.publish('hud.toast',{text:'Double-or-Nothing unavailable (limit reached).'}); return; }
    if(DNU.count===0){ DNU.count=1; eventBus.publish('hud.toast',{text:'Double-or-Nothing ready. Risk it? Flip again!'}); return; }
    if(DNU.count===1){ DNU.count=2; DNU.locked=true; eventBus.publish('hud.toast',{text:'Last Double-or-Nothing allowed this season!'}); return; }
  });
  eventBus.subscribe('season.advance', ()=>{ DNU.count=0; DNU.locked=false; DNU.season+=1; });
})();
</script>

<!-- ====== SAVE / TRANSCRIPT ====== -->
<script>
(function(){
  const LS_RUN='uls.currentRun', LS_SLOTS='uls.saveSlots';
  const Save = {
    cur:null, init(){ this.cur=JSON.parse(localStorage.getItem(LS_RUN)||'null')||this.new(); this.flush(); },
    new(){ return {runId:Date.now()+'-'+Math.random().toString(36).slice(2), player:{}, stats:{}, realm:'uls', log:[]}; },
    logTurn(entry){ this.cur.log.push(entry); this.flush(); },
    setPlayer(p){ Object.assign(this.cur.player,p); this.flush(); },
    setStats(s){ Object.assign(this.cur.stats,s); this.flush(); },
    setRealm(r){ this.cur.realm=r; this.flush(); },
    flush(){ localStorage.setItem(LS_RUN, JSON.stringify(this.cur)); },
    export(){ const b=new Blob([JSON.stringify(this.cur,null,2)],{type:'application/json'}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download='uls_'+this.cur.runId+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),500); },
    import(obj){ if(!obj?.log) return false; this.cur=obj; this.flush(); return true; },
    saveSlot(i,title){ const slots=JSON.parse(localStorage.getItem(LS_SLOTS)||'[]'); while(slots.length<3) slots.push(null); slots[i]={title:title||('Save '+(i+1)), ts:Date.now(), snapshot:this.cur}; localStorage.setItem(LS_SLOTS, JSON.stringify(slots)); },
    loadSlot(i){ const s=JSON.parse(localStorage.getItem(LS_SLOTS)||'[]')[i]; if(!s) return false; this.cur=s.snapshot; this.flush(); return true; }
  };
  Save.init();
  window.Save=Save;

  eventBus.subscribe('turn.commit', e=>Save.logTurn(e));
  eventBus.subscribe('character.created', p=>{ Save.setPlayer(p.player); Save.setStats(p.stats); });
  eventBus.subscribe('stats.update', s=>Save.setStats(__app.stats));
  eventBus.subscribe('realm.changed', p=>Save.setRealm(p.realm));

  // quick buttons
  const bar=document.createElement('div'); bar.style.cssText='position:fixed;right:12px;bottom:60px;background:rgba(0,0,0,.5);color:#fff;padding:6px;border-radius:8px;z-index:9999';
  bar.innerHTML=`<button onclick="Save.export()">Export</button>
  <button onclick="Save.saveSlot(0,'Slot 1')">Save1</button><button onclick="Save.loadSlot(0)">Load1</button>
  <button onclick="Save.saveSlot(1,'Slot 2')">Save2</button><button onclick="Save.loadSlot(1)">Load2</button>`;
  document.body.appendChild(bar);
})();
</script>

<!-- ====== CONSEQUENCE SYSTEM ====== -->
<script>
(function(){
  const TICK_INTERVAL = 5000; // 5 seconds

  function gameTick() {
    if (__app.stats.heat > 0) {
      // The chance of a consequence is (heat / 10).
      // At heat 1, it's 10%. At max heat 5, it's 50%.
      const chance = __app.stats.heat / 10;
      if (Math.random() < chance) {
        const moneyLost = 50;
        eventBus.publish('hud.toast', { text: `Police shakedown! You lost $${moneyLost}.` });
        eventBus.publish('stats.update', {
          money: Math.max(0, __app.stats.money - moneyLost),
          heat: Math.max(0, __app.stats.heat - 1)
        });
      }
    }
  }

  setInterval(gameTick, TICK_INTERVAL);
  console.log('Consequence System initialized with a 5-second tick.');
})();
</script>

<!-- ====== MONKEY PAW (item + iframe grants) ====== -->
<script>
(function(){
  const Paw={ wishes:5, active:false, iframe:null };
  function openPaw(){
    if(!Paw.iframe){
      const w=document.createElement('div'); w.id='paw-host'; w.style.cssText='position:fixed;inset:10%;background:#000;z-index:99999';
      w.innerHTML='<iframe id="paw-iframe" src="'+ULS_CONFIG.MONKEYPAW_URL+'" style="width:100%;height:100%;border:0"></iframe><button style="position:absolute;right:10px;top:10px" onclick="document.getElementById(\'paw-host\').remove();">Close</button>';
      document.body.appendChild(w);
      Paw.iframe = document.getElementById('paw-iframe');
      window.addEventListener('message', onMsg);
    }
  }
  function onMsg(e){
    const d=e.data;
    if(!d||!d.type) return;
    if(d.type==='monkeypaw.ready'){ Paw.active=true; eventBus.publish('hud.toast',{text:'Monkey Paw is listening… (wishes left: '+Paw.wishes+')'}); }
    if(d.type==='monkeypaw.grant' && Paw.wishes>0){
      Paw.wishes--;
      // typical payload: { type:'money', amount:100 } OR { type:'fame', amount:5 } etc.
      const g=d.payload||{};
      if(g.type==='money') eventBus.publish('stats.update',{money:__app.stats.money+(g.amount||100)});
      if(g.type==='fame')  eventBus.publish('stats.update',{fame:Math.min(100,__app.stats.fame+(g.amount||3))});
      if(g.type==='health')eventBus.publish('stats.update',{health:Math.min(100,__app.stats.health+(g.amount||10))});
      // inevitable curse:
      setTimeout(()=>{ eventBus.publish('hud.toast',{text:'The Paw takes its price…'}); eventBus.publish('stats.update',{sanity:Math.max(0,__app.stats.sanity-15)}); }, 800);
      eventBus.publish('hud.toast',{text:'Wish granted. ('+Paw.wishes+' left)'});
    }
  }

  eventBus.subscribe('monkeypaw.pickup', ()=>{
    Paw.active=true;
    eventBus.publish('hud.toast',{text:'You found the Monkey Paw (5 wishes). Type: wish money 500 / wish fame 5 / etc.'});
  });
  eventBus.subscribe('monkeypaw.open', openPaw);
  window.MonkeyPaw={ open:openPaw };
})();
</script>

<!-- ====== LIVING HELL ====== -->
<script>
(function(){
  const LH = {
    enter(){
      __app.realm='living-hell';
      eventBus.publish('image.request',{prompt:'reality show house interior, fishtank glass walls, cameras, dramatic lighting'});
      __app.gameManager.commitTurn({
        realm:'living-hell',
        text:"You're live. Keep the crowd happy. What's your move?",
        decisions:[{text:'truth or dare'},{text:'perform a stunt'},{text:'confess a secret'},{text:'prank someone'}],
        hype:true
      });
    }

  eventBus.subscribe('applyDecision', a=>{
    if(__app.realm!=='living-hell') return;
    eventBus.publish('narrator.ask',{ realm:'living-hell', mode:'audience', prompt:a.text, history:__app.history });
  });
  __app.router.register('living-hell', LH);
})();
</script>

<!-- ====== CITY (ULS) ====== -->
<script>
(function(){
  const ULS = {
    enter(){
      eventBus.publish('image.request',{prompt:'nighttime neon-splashed megacity streets, Tokyo x New York mashup, rain-slick, crowds and signage'});
      eventBus.publish('hud.toast',{text:'Welcome to Chroma City.'});
      ULS.prompt();
    },
    prompt(){
      const q = "Where to? [explore • take a gig • rest • shop • rideshare • DND tournament • switch realm]";
      const decisions = [
        {text:'explore district'},{text:'take a gig'},{text:'rest at apartment'},{text:'shop'},
        {text:'take a rideshare job'},{text:'enter DND tournament'},{text:'switch realm'}
      ];
      __app.gameManager.commitTurn({ realm:'uls', text:q, decisions });
    }
  };
  eventBus.subscribe('applyDecision', a=>{
    if(__app.realm!=='uls') return;
    const t=(a.text||'').toLowerCase();
    if(t.includes('explore')){ eventBus.publish('image.request',{prompt:'neon market district, crowds, signage, rainy reflections'}); ask('explore'); }
    else if(t.includes('gig')){ ask('gig'); }
    else if(t.includes('rest')){ eventBus.publish('image.request',{prompt:'small city apartment interior, cozy neon window glow'}); ask('rest'); eventBus.publish('rest.sober'); }
    else if(t.includes('shop')){ ask('shop'); }
    else if(t.includes('ride')){ eventBus.publish('job.uber.start',{}); }
    else if(t.includes('dnd')){ eventBus.publish('job.dnd.start'); }
    else if(t.includes('switch')){ __app.router.go('menu'); }
  });
  function ask(intent){ eventBus.publish('narrator.ask',{ realm:'uls', intent, player:__app.player, stats:__app.stats, history:__app.history }); }
  __app.router.register('uls', ULS);
})();
</script>

<!-- ====== TURN LOOP & INPUT HANDLER ====== -->
<script>
(function(){
  const input = document.getElementById('playerInput');
  const button= document.getElementById('submitBtn');

  function commitAction(text){
    if(!text.trim()) return;
    // chat commands
    const t=text.trim().toLowerCase();
    if(t==='menu'){ __app.router.go('menu'); return; }
    if(t==='paw'){ eventBus.publish('monkeypaw.open'); return; }
    if(t.startsWith('wish ')){ // wish money 500 / wish fame 5 / wish health 10
      const parts=t.split(/\s+/); const type=parts[1]; const amt=parseInt(parts[2]||'0',10);
      eventBus.publish('monkeypaw.wish',{type, amount:isNaN(amt)?undefined:amt}); return;
    }
    if(t==='flip'){ eventBus.publish('coin.flip',{difficulty:'even', reward:15, failDamage:10}); return; }
    if(t==='double or nothing' || t==='double-or-nothing'){ eventBus.publish('coin.doubleOrNothing'); return; }
    if(t==='drink'){ eventBus.publish('drink.alcohol'); eventBus.publish('hud.toast',{text:'You take a drink…'}); }
    if(t.startsWith('heat')){ // heat 2
      const amt = parseInt(t.split(' ')[1] || '1', 10);
      eventBus.publish('heat.add', { amount: isNaN(amt) ? 1 : amt });
      return;
    }

    __app.gameManager.commitTurn({ realm:__app.realm, playerAction:text });

    // route to current realm narrator
    if(__app.realm==='uls') eventBus.publish('narrator.ask',{ realm:'uls', prompt:text, history:__app.history });
    if(__app.realm==='living-hell') eventBus.publish('narrator.ask',{ realm:'living-hell', prompt:text, mode:'audience', history:__app.history });
    if(__app.realm==='dreamworld') eventBus.publish('narrator.ask',{ realm:'dreamworld', prompt:text, history:__app.history });
    if(__app.realm==='backrooms') eventBus.publish('narrator.ask',{ realm:'backrooms', prompt:text, history:__app.history });
  }

  input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ commitAction(input.value); input.value=''; }});
  button.addEventListener('click', ()=>{ commitAction(input.value); input.value=''; });

  // Narrator responses enforce “consequence → next question”
  eventBus.subscribe('narrator.response', pay=>{
    if(pay?.statsDelta) eventBus.publish('stats.update', Object.assign(__app.stats, pay.statsDelta));
    if(pay?.forceImagePrompt) eventBus.publish('image.request',{prompt:pay.forceImagePrompt});
    const nq = (__app.realm==='living-hell') ? "What's your move? Keep the crowd happy—hurry!" : (pay?.nextQuestion || "What do you do next?");
    const decisions = pay?.decisions || [{text:'continue'}];
    __app.gameManager.commitTurn({ realm:__app.realm, text:nq, decisions });
  });

  // Result sounds from coin flips (in case narrator delegates back)
  eventBus.subscribe('coin.result', r=>{ if(r.success) playDing(); else playBuzz(); });
})();
</script>
